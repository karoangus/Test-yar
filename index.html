<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="تست‌یار — ساخت، برگزاری و تصحیح آزمون‌های تستی چهارگزینه‌ای با تایمر دقیق و قابلیت توقف" />
    <title>تست‌یار | آزمون‌ساز و تصحیح‌کننده</title>
    <script>
      // اعمال تم پیش از نخستین رنگ‌آمیزی تا صفحه پرش رنگ نداشته باشد
      (function () {
        try {
          var stored = localStorage.getItem('testyar.theme.v1');
          var dark =
            stored === 'dark' ||
            ((stored == null || stored === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a0f1d');
        } catch (e) {
          /* بدون تم هم برنامه کار می‌کند */
        }
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest?v=4.1.0" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=4.1.0" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-180.png?v=4.1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تست‌یار" />
    <link rel="stylesheet" href="./assets/fonts/fonts.css?v=4.1.0" />
    <link rel="stylesheet" href="./src/styles/app.css?v=4.1.0" />
      <link rel="stylesheet" href="./css/offline.css?v=4.1.0" />
  </head>

    <section id="offline-settings" class="offline-settings" aria-label="تنظیمات آفلاین"></section>
    <noscript>
      <p style="font-family: sans-serif; text-align: center; padding: 2rem">
        برای استفاده از تست‌یار لطفاً جاوااسکریپت را فعال کنید.
      </p>
    </noscript>

  </body>
