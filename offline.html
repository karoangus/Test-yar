<h1>اتصال برقرار نیست</h1>
<p>پوستهٔ برنامه در دسترس نیست. از پاک‌کردن داده‌های سایت یا حذف برنامه خودداری کنید؛ ممکن است آزمون‌ها پاک شوند.</p>
<p>پس از اتصال مجدد، برنامه را باز کنید و در بخش آفلاین گزینهٔ «ذخیره آفلاین» را بزنید. اگر برنامه باز شد، از تاریخچه پشتیبان بگیرید.</p>
